# SUMMARY: Hand-approved labels for news names that can't be linked (D-099).
# Claude drafts each label; Bruno approves it. Matching (step 2) uses a label only
# when no stronger rule applies (an adviser, an exact match, a sponsor word, a family).
# A name not listed here, with no other evidence, becomes "unresolved".
#
# outcome: "out-of-scope" = a real company or firm our graph doesn't cover;
#          "non-entity"   = nothing to link to, ever; "kind" says what sort.
# The name must be written exactly as in the release (matching ignores capitals).

# --- Other investment firms and their funds (real, but not our three sponsors) ---
