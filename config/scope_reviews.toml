# SUMMARY: Bruno's hand decisions for the scope step (D-052). Applied on every
# run, on any day, so they survive rebuilds; git keeps their history.
# The review list to work from is docs/scope-review.md (regenerated by `make facts`).
#
# Two kinds of entry:
#
# 1. A decision about one entity for one sponsor (Review cases, and look-alikes
#    to mark Out, D-053). Copy this block, uncomment it and fill it in:
#
# [[entity]]
# lei = "549300C9IGR23EW13J25"          # the entity's LEI
# sponsor = "bridgepoint"                 # hg, bridgepoint or apax
# verdict = "out"                         # "in" or "out"
# reason = "A church in Texas, unrelated to the firm."
# decided = 2026-10-18                    # the date of the decision
#
# 2. A decision about a care-of name not in our data (D-048). One answer covers
#    every entity whose address is care of that name:
#
# [[care_of]]
# name = "Apax Partners Guernsey Limited" # exactly as shown in docs/scope-review.md
# sponsor = "apax"
# verdict = "in"                          # "in": it's a sponsor company; "out": it isn't
# reason = "Apax's Guernsey administration company."
# decided = 2026-10-18
